  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script defer src="/akenm-common.js"></script>

  <style>
    :root {
      --bg: #05070d;
      --panel: #0b0e16;
      --ink: #eef1f6;
      --muted: rgba(224, 230, 240, .60);
      --line: rgba(224, 230, 240, .15);
      --ice: #76afff;
      --violet: #b77aff;
      --ease: cubic-bezier(.2, .75, .2, 1);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
    }
    body {
      overflow-x: hidden;
      font-family: "Space Grotesk", "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", sans-serif;
    }
    button, a { font: inherit; }

    .film-bg, .grain, .wash {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
    .film-bg {
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 74% 14%, rgba(73, 112, 183, .12), transparent 31%),
        linear-gradient(135deg, #04060b, #090c15 48%, #04060b);
    }
    .film-bg::before, .film-bg::after {
      content: "";
      position: absolute;
      width: 60vw;
      height: 60vw;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .17;
      animation: drift 16s ease-in-out infinite alternate;
    }
    .film-bg::before {
      left: -26vw;
      top: -28vw;
      background: var(--ice);
    }
    .film-bg::after {
      right: -30vw;
      bottom: -34vw;
      background: var(--violet);
      animation-delay: -7s;
    }
    .wash {
      z-index: 1;
      background: linear-gradient(105deg, transparent 22%, rgba(173, 207, 255, .06) 46%, transparent 65%);
      transform: translateX(-60%);
      animation: projector 9s linear infinite;
    }
    .grain {
      z-index: 2;
      opacity: .105;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
      animation: grain .18s steps(2) infinite;
    }

    @keyframes drift { to { transform: translate(12vw, 8vw) scale(1.18); } }
    @keyframes projector { to { transform: translateX(80%); } }
    @keyframes grain {
      25% { transform: translate(-2%, 1%); }
      50% { transform: translate(1%, -2%); }
      75% { transform: translate(2%, 2%); }
    }

    .brand {
      position: fixed;
      z-index: 80;
      left: max(18px, env(safe-area-inset-left));
      top: max(18px, env(safe-area-inset-top));
      color: rgba(233, 236, 241, .82);
      text-decoration: none;
      font: 500 10px/1 system-ui, sans-serif;
      letter-spacing: .46em;
      white-space: nowrap;
    }
    .top-menu {
      position: fixed;
      z-index: 80;
      right: 18px;
      top: 14px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(5, 7, 13, .20);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(233, 236, 241, .88);
      font-size: 16px;
      line-height: 1;
      letter-spacing: .18em;
      cursor: pointer;
    }
    .top-menu::before, .top-menu::after { content: none !important; }
    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: none;
      background: rgba(0, 0, 0, .55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .menu-overlay.open { display: block; }
    .menu-panel {
      position: absolute;
      right: 18px;
      top: 68px;
      min-width: 240px;
      padding: 14px 14px 10px;
      border: 1px solid rgba(233, 236, 241, .16);
      border-radius: 18px;
      background: rgba(5, 7, 13, .86);
      box-shadow: 0 18px 60px rgba(0, 0, 0, .45);
    }
    .menu-list { list-style: none; margin: 0; padding: 0; }
    .menu-list a {
      display: block;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: rgba(233, 236, 241, .84);
      text-decoration: none;
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .menu-list a:hover, .menu-list a[aria-current="page"] {
      color: rgba(233, 236, 241, .98);
      border-color: rgba(233, 236, 241, .18);
      background: rgba(233, 236, 241, .06);
    }
    .menu-sep { height: 1px; margin: 10px 6px; background: rgba(233, 236, 241, .12); }
    .lang-row {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 6px 6px 2px;
    }
    .lang-row button {
      padding: 6px 8px;
      border: 1px solid rgba(233, 236, 241, .14);
      border-radius: 999px;
      background: rgba(5, 7, 13, .20);
      color: rgba(233, 236, 241, .72);
      font-size: 10px;
      line-height: 1;
      letter-spacing: .14em;
      cursor: pointer;
    }
    .lang-row button.active {
      color: var(--bg);
      border-color: rgba(233, 236, 241, .92);
      background: rgba(233, 236, 241, .92);
    }

    main {
      position: relative;
      z-index: 4;
      min-height: 100svh;
      padding: clamp(100px, 14vh, 160px) clamp(18px, 5vw, 72px) 60px;
      display: grid;
      grid-template-columns: minmax(220px, .72fr) minmax(440px, 1.4fr);
      gap: clamp(44px, 8vw, 140px);
      align-items: center;
    }
    .intro { align-self: end; padding-bottom: 3vw; }
    .index {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .28em;
    }
    .index::after { content: ""; width: 52px; height: 1px; background: var(--line); }
    h1 {
      margin: 0;
      font-size: clamp(50px, 8.5vw, 138px);
      line-height: .78;
      letter-spacing: -.075em;
      text-transform: uppercase;
    }
    .slash {
      color: transparent;
      background: linear-gradient(135deg, var(--ice), var(--violet));
      -webkit-background-clip: text;
      background-clip: text;
      font-weight: 500;
    }
    .copy {
      max-width: 470px;
      margin: 42px 0 0;
      color: rgba(224, 230, 240, .76);
      font-size: clamp(14px, 1.15vw, 17px);
      font-weight: 500;
      line-height: 1.9;
      letter-spacing: -.025em;
    }

    .projection { position: relative; }
    .frame-link {
      display: block;
      position: relative;
      color: inherit;
      text-decoration: none;
      perspective: 1200px;
    }
    .screen {
      position: relative;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #080b13;
      clip-path: polygon(2% 0, 100% 3%, 98% 100%, 0 96%);
      box-shadow: 0 48px 120px rgba(0, 0, 0, .62), 0 0 70px rgba(91, 137, 214, .08);
      transform: rotateY(-2deg);
      transition: transform .65s var(--ease), box-shadow .65s var(--ease);
    }
    .frame-link:hover .screen {
      transform: rotateY(0) scale(1.012);
      box-shadow: 0 52px 130px rgba(0, 0, 0, .64), 0 0 90px rgba(118, 175, 255, .13);
    }
    .visual {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(128deg,
          #0a0d15 0 27%,
          rgba(118, 175, 255, .68) 27% 28%,
          #111827 28% 53%,
          rgba(183, 122, 255, .58) 53% 54%,
          #060910 54% 100%);
    }
    .visual::before {
      content: "";
      position: absolute;
      left: 16%;
      top: 12%;
      width: 48%;
      height: 74%;
      border: 1px solid rgba(196, 218, 255, .48);
      background: linear-gradient(145deg, rgba(118, 175, 255, .16), rgba(183, 122, 255, .05) 48%, transparent 72%);
      box-shadow: inset 0 0 45px rgba(118, 175, 255, .08), 0 0 55px rgba(118, 175, 255, .07);
      transform: skew(-8deg);
      animation: aperture 6s var(--ease) infinite alternate;
    }
    .visual::after {
      content: "AK ENM\A MOVING IMAGE";
      white-space: pre;
      position: absolute;
      right: 6%;
      bottom: 8%;
      color: rgba(238, 241, 246, .92);
      font-size: clamp(12px, 1.5vw, 22px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: .06em;
      text-align: right;
      text-shadow: 0 0 24px rgba(118, 175, 255, .26);
    }
    @keyframes aperture {
      to { left: 27%; width: 30%; transform: skew(7deg); }
    }
    .scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0 4px, rgba(185, 205, 239, .025) 5px);
      mix-blend-mode: screen;
    }
    .cursor-light {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(164, 204, 255, .26), rgba(154, 134, 255, .09) 32%, transparent 66%);
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .frame-link:hover .cursor-light { opacity: 1; }
    .caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 20px;
      padding: 0 1.5%;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .view { color: var(--ink); }
    .edge {
      position: absolute;
      z-index: 2;
      width: 30px;
      height: 30px;
      border-color: rgba(154, 192, 255, .48);
      border-style: solid;
    }
    .e1 { left: -8px; top: -8px; border-width: 1px 0 0 1px; }
    .e2 { right: -8px; bottom: 35px; border-width: 0 1px 1px 0; }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
        gap: 54px;
        align-items: start;
        padding-top: 118px;
      }
      .intro { padding: 0; }
      .copy { margin-top: 30px; }
      .projection { width: 100%; }
    }
    @media (max-width: 560px) {
      .brand {
        left: 14px;
        top: max(16px, env(safe-area-inset-top));
        font-size: 9px;
        letter-spacing: .36em;
      }
      .top-menu { right: 12px; top: 10px; }
      .menu-panel { right: 12px; top: 62px; min-width: 220px; }
      main { padding-left: 16px; padding-right: 16px; }
      .caption { letter-spacing: .13em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

<body data-akenm-page="film">
  <div class="film-bg" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <a class="brand route" data-route="home" href="/home/" aria-label="AK ENM Home">AK ENM</a>
  <button class="top-menu" type="button" aria-label="Menu" aria-expanded="false">⋯</button>
  <div class="menu-overlay" aria-hidden="true">
    <nav class="menu-panel" aria-label="Primary">
      <ul class="menu-list">
        <li><a class="route" data-route="home" data-i18n="home" href="/home/">홈</a></li>
        <li><a class="route" data-route="about" data-i18n="about" href="/about/">소개</a></li>
        <li><a class="route" data-route="music" data-i18n="music" href="/music/">음악</a></li>
        <li><a class="route" data-route="film" data-i18n="film" href="/film-visual/" aria-current="page">필름 / 비주얼</a></li>
        <li><a class="route" data-route="publish" data-i18n="publish" href="/publications/">출판</a></li>
        <li><a class="route" data-route="artists" data-i18n="artists" href="/artists/">아티스트</a></li>
        <li><a class="route" data-route="atelier" data-i18n="atelier" href="/atelier/">아틀리에</a></li>
        <li><a class="route" data-route="contact" data-i18n="contact" href="/contact/">문의</a></li>
      </ul>
      <div class="menu-sep" aria-hidden="true"></div>
      <div class="lang-row" aria-label="Language">
        <button type="button" data-lang="ko">KO</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">JP</button>
        <button type="button" data-lang="zh">CN</button>
      </div>
    </nav>
  </div>

  <main>
    <section class="intro" aria-labelledby="film-title">
      <div class="index">04 — MOVING IMAGE</div>
      <h1 id="film-title">Film<span class="slash">/</span><br>Visual</h1>
      <p class="copy" data-copy>AK ENM은 서사·이미지·음악·영상이 만나는 순간을 설계합니다.<br>각 감각은 하나의 장면으로 연결되고,<br>기술은 몰입을 확장하는 구조가 됩니다.</p>
    </section>

    <section class="projection" aria-label="Moving image archive">
      <span class="edge e1" aria-hidden="true"></span>
      <span class="edge e2" aria-hidden="true"></span>
      <a class="frame-link" href="https://arakorea.org/kculture-video.html" target="_blank" rel="noopener noreferrer" aria-label="AK ENM moving-image archive 열기">
        <div class="screen" aria-hidden="true">
          <div class="visual"></div>
          <div class="scan"></div>
          <div class="cursor-light"></div>
        </div>
        <div class="caption">
          <span data-archive>Selected moving-image archive</span>
          <span class="view" data-view>작품 보기 ↗</span>
        </div>
      </a>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'akenm-language';
      const words = {
        ko: {
          copy: 'AK ENM은 서사·이미지·음악·영상이 만나는 순간을 설계합니다.<br>각 감각은 하나의 장면으로 연결되고,<br>기술은 몰입을 확장하는 구조가 됩니다.',
          archive: 'Selected moving-image archive',
          view: '작품 보기 ↗',
          home: '홈', about: '소개', music: '음악', film: '필름 / 비주얼', publish: '출판', artists: '아티스트', atelier: '아틀리에', contact: '문의'
        },
        en: {
          copy: 'AK ENM composes the moment where narrative, image, music and film meet.<br>Each sense flows into a single scene, with technology extending immersion.',
          archive: 'Selected moving-image archive',
          view: 'View project ↗',
          home: 'Home', about: 'About', music: 'Music', film: 'Film / Visual', publish: 'Publish', artists: 'Artists', atelier: 'Atelier', contact: 'Contact'
        },
        ja: {
          copy: 'AK ENMは物語・イメージ・音楽・映像が出会う瞬間を設計します。<br>すべての感覚がひとつのシーンへつながり、技術が没入の世界を広げます。',
          archive: 'Selected moving-image archive',
          view: '作品を見る ↗',
          home: 'ホーム', about: '紹介', music: '音楽', film: '映像', publish: '出版', artists: 'アーティスト', atelier: 'アトリエ', contact: 'お問い合わせ'
        },
        zh: {
          copy: 'AK ENM构筑叙事、图像、音乐与影像相遇的瞬间。<br>每一种感官汇聚成完整场景，技术由此拓展沉浸体验。',
          archive: 'Selected moving-image archive',
          view: '观看作品 ↗',
          home: '首页', about: '关于', music: '音乐', film: '影像', publish: '出版', artists: '艺术家', atelier: '创作空间', contact: '联系'
        }
      };
      const htmlLang = { ko: 'ko', en: 'en', ja: 'ja', zh: 'zh-CN' };
      const localRoutes = {
        home: 'home.html', about: 'about.html', music: 'music.html', film: 'film-visual.html',
        publish: 'publications.html', artists: 'artists.html', atelier: 'atelier.html', contact: 'contact.html'
      };

      let saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (_) {}
      const browserLanguage = (navigator.language || 'en').slice(0, 2).toLowerCase();
      let language = words[saved] ? saved : (words[browserLanguage] ? browserLanguage : 'en');

      function render() {
        document.documentElement.lang = htmlLang[language];
        document.querySelector('[data-copy]').innerHTML = words[language].copy;
        document.querySelector('[data-archive]').textContent = words[language].archive;
        document.querySelector('[data-view]').textContent = words[language].view;
        document.querySelectorAll('[data-i18n]').forEach(element => {
          element.textContent = words[language][element.dataset.i18n];
        });
        document.querySelectorAll('[data-lang]').forEach(button => {
          const active = button.dataset.lang === language;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', String(active));
        });
        try { localStorage.setItem(STORAGE_KEY, language); } catch (_) {}
      }

      document.querySelectorAll('[data-lang]').forEach(button => {
        button.addEventListener('click', () => {
          language = button.dataset.lang;
          render();
        });
      });
      render();

      const menuButton = document.querySelector('.top-menu');
      const overlay = document.querySelector('.menu-overlay');
      const closeMenu = () => {
        overlay.classList.remove('open');
        overlay.setAttribute('aria-hidden', 'true');
        menuButton.setAttribute('aria-expanded', 'false');
      };
      menuButton.addEventListener('click', () => {
        const open = overlay.classList.toggle('open');
        overlay.setAttribute('aria-hidden', String(!open));
        menuButton.setAttribute('aria-expanded', String(open));
      });
      overlay.addEventListener('click', event => {
        if (event.target === overlay) closeMenu();
      });
      addEventListener('keydown', event => {
        if (event.key === 'Escape') closeMenu();
      });

      if (location.protocol === 'file:') {
        document.querySelectorAll('.route').forEach(anchor => {
          anchor.href = localRoutes[anchor.dataset.route];
        });
      }

      const screen = document.querySelector('.screen');
      const light = document.querySelector('.cursor-light');
      screen.addEventListener('pointermove', event => {
        const bounds = screen.getBoundingClientRect();
        light.style.left = `${event.clientX - bounds.left}px`;
        light.style.top = `${event.clientY - bounds.top}px`;
      });
    })();
  </script>
</body>
</html>
