<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const enter = document.getElementById('enter');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const lowPower = (navigator.deviceMemory && navigator.deviceMemory <= 4) || matchMedia('(pointer:coarse)').matches;

  // ==========================
  // Trail buffer (light afterglow, premium)
  // ==========================
  const trail = document.createElement('canvas');
  const tctx = trail.getContext('2d');
  let tw=1, th=1;
  function resizeTrail(){
    tw = trail.width = w;
    th = trail.height = h;
  }

  // ==========================

  // Helpers
  // ==========================
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const TAU = Math.PI*2;

  // ==========================
  // Premium micro-grain (subtle, tiled) + beam particles
  // ==========================
  const grain = document.createElement('canvas');
  const gctx = grain.getContext('2d');
  let gw=256, gh=256;
  function buildGrain(){
    gw = grain.width = 256;
    gh = grain.height = 256;
    const img = gctx.createImageData(gw, gh);
    // very subtle luminance noise
    for(let i=0;i<img.data.length;i+=4){
      const v = (Math.random()*255)|0;
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=26; // alpha
    }
    gctx.putImageData(img,0,0);
  }
  buildGrain();

  const particles = [];
  function spawnBeamParticles(sx,sy,tx,ty){
    // limited count, spawn near the beam
    const want = isMobile()? 2 : 3;
    for(let i=0;i<want;i++){
      particles.push({
        t: Math.random()*0.55, // along beam
        v: 0.55 + Math.random()*0.65,
        o: (Math.random()*2-1) * (isMobile()? 9: 14) * dpr, // side offset
        r: (0.9 + Math.random()*1.6) * dpr,
        a: 0.22 + Math.random()*0.22
      });
    }
    // cap
    const cap = isMobile()? 90 : 140;
    if(particles.length>cap) particles.splice(0, particles.length-cap);
  }

  function drawBeamParticles(sx,sy,tx,ty){
    if(!particles.length) return;
    const vx = tx - sx, vy = ty - sy;
    const dist = Math.hypot(vx,vy) + 1e-6;
    const nx = vx/dist, ny = vy/dist;
    const px = -ny, py = nx;

    ctx.globalCompositeOperation='screen';
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.t += (p.v * 0.010);
      p.a *= 0.992;
      if(p.t>1.02 || p.a<0.02){ particles.splice(i,1); continue; }

      const tt = p.t;
      const cx = sx + vx*tt + px*p.o;
      const cy = sy + vy*tt + py*p.o;

      const rr = p.r * (1.0 + 0.45*Math.sin((performance.now()*0.01) + tt*6.0));
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,rr*7.0);
      grad.addColorStop(0, `rgba(233,236,241,${p.a})`);
      grad.addColorStop(0.28, `rgba(233,236,241,${p.a*0.25})`);
      grad.addColorStop(1, 'rgba(233,236,241,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(cx-rr*8, cy-rr*8, rr*16, rr*16);
    }
    ctx.globalCompositeOperation='source-over';
  }

  function isPortrait(){ return innerHeight > innerWidth; }
  function isMobile(){ return Math.min(innerWidth, innerHeight) < 820; }

  // ==========================
  // Sizing
  // ==========================
  let w,h,dpr;
  function resize(){
    const vw = window.visualViewport ? visualViewport.width : innerWidth;
    const vh = window.visualViewport ? visualViewport.height : innerHeight;
    dpr = Math.min(lowPower ? 1.45 : 2, window.devicePixelRatio || 1);
    w = canvas.width = Math.floor(vw * dpr);
    h = canvas.height = Math.floor(vh * dpr);
    canvas.style.width = vw + 'px';
    canvas.style.height = vh + 'px';
    resizeTrail();
    buildWeb();
  }
  addEventListener('resize', resize, {passive:true});
  window.visualViewport?.addEventListener('resize', resize, {passive:true});

  // ==========================
  // Pointer (NO smoothing -> instant)
  // ==========================
  const beamPalettes = [
    {name:'pearl',rgb:'233,236,241',accent:'153,180,214'},
    {name:'ice',rgb:'137,205,255',accent:'64,134,255'},
    {name:'violet',rgb:'204,162,255',accent:'118,78,229'},
    {name:'champagne',rgb:'244,205,139',accent:'190,130,63'}
  ];
  const pointer = { px:0, py:0, vx:0, vy:0, down:false, seen:false, holdStart:0, holdMs:0, mode:(Math.random()*beamPalettes.length)|0 };
  const palette = ()=>beamPalettes[pointer.mode];
  const shockwaves = [];
  const audio = {ctx:null,osc:null,harmonic:null,gain:null,filter:null,pan:null,active:false};

  function ensureAudio(){
    if(!audio.ctx){
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if(!AudioContext) return false;
      audio.ctx = new AudioContext();
    }
    if(audio.ctx.state==='suspended') audio.ctx.resume();
    return true;
  }

  function startHoldSound(){
    if(!ensureAudio() || audio.active) return;
    const ctx=audio.ctx,mode=pointer.mode;
    const roots=[146.83,220,164.81,196];
    audio.osc=ctx.createOscillator();
    audio.harmonic=ctx.createOscillator();
    audio.gain=ctx.createGain();
    audio.filter=ctx.createBiquadFilter();
    audio.pan=ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    audio.osc.type=mode===1?'triangle':'sine';
    audio.harmonic.type=mode===2?'triangle':'sine';
    audio.osc.frequency.setValueAtTime(roots[mode],ctx.currentTime);
    audio.harmonic.frequency.setValueAtTime(roots[mode]*2.01,ctx.currentTime);
    audio.filter.type='lowpass';
    audio.filter.frequency.setValueAtTime(520,ctx.currentTime);
    audio.filter.Q.setValueAtTime(3.2,ctx.currentTime);
    audio.gain.gain.setValueAtTime(.0001,ctx.currentTime);
    audio.gain.gain.exponentialRampToValueAtTime(.035,ctx.currentTime+.045);
    audio.osc.connect(audio.filter);audio.harmonic.connect(audio.filter);
    audio.filter.connect(audio.gain);
    if(audio.pan){audio.gain.connect(audio.pan);audio.pan.connect(ctx.destination)}else audio.gain.connect(ctx.destination);
    audio.osc.start();audio.harmonic.start();audio.active=true;
  }

  function updateHoldSound(ms){
    if(!audio.active) return;
    const ctx=audio.ctx,k=clamp(ms/900,0,1),mode=pointer.mode;
    const roots=[146.83,220,164.81,196],root=roots[mode];
    audio.osc.frequency.setTargetAtTime(root*(1+k*.48),ctx.currentTime,.035);
    audio.harmonic.frequency.setTargetAtTime(root*(2.01+k*.72),ctx.currentTime,.04);
    audio.filter.frequency.setTargetAtTime(520+k*(1700+mode*220),ctx.currentTime,.045);
    audio.gain.gain.setTargetAtTime(.032+k*.025,ctx.currentTime,.05);
    if(audio.pan) audio.pan.pan.setTargetAtTime(clamp(pointer.px/w*2-1,-.72,.72),ctx.currentTime,.06);
  }

  function stopHoldSound(withRelease=true){
    if(!audio.active) return;
    const ctx=audio.ctx,now=ctx.currentTime,osc=audio.osc,harmonic=audio.harmonic,gain=audio.gain;
    gain.gain.cancelScheduledValues(now);
    gain.gain.setValueAtTime(Math.max(.0001,gain.gain.value),now);
    gain.gain.exponentialRampToValueAtTime(.0001,now+.18);
    osc.stop(now+.2);harmonic.stop(now+.2);audio.active=false;
    if(withRelease) playReleaseTone();
  }

  function playReleaseTone(){
    if(!audio.ctx) return;
    const ctx=audio.ctx,now=ctx.currentTime,mode=pointer.mode;
    const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
    const notes=[293.66,440,329.63,392];
    o.type='sine';o.frequency.setValueAtTime(notes[mode],now);o.frequency.exponentialRampToValueAtTime(notes[mode]*.74,now+.42);
    f.type='bandpass';f.frequency.value=900+mode*180;f.Q.value=1.2;
    g.gain.setValueAtTime(.032,now);g.gain.exponentialRampToValueAtTime(.0001,now+.48);
    o.connect(f);f.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+.5);
  }
  let lastPointer = {px:0, py:0};
  let lastMoveAt = performance.now();

  function setPointerFromEvent(e){
    const cx = (e.clientX ?? (e.touches && e.touches[0].clientX) ?? innerWidth*0.5);
    const cy = (e.clientY ?? (e.touches && e.touches[0].clientY) ?? innerHeight*0.5);
    pointer.px = cx * dpr;
    pointer.py = cy * dpr;
    pointer.seen = true;
    lastMoveAt = performance.now();
  }

  addEventListener('pointermove', (e)=>{ setPointerFromEvent(e); }, {passive:true});
  addEventListener('pointerdown', (e)=>{
    if(e.target.closest && e.target.closest('#enter')) return;
    pointer.down=true;
    pointer.mode=(pointer.mode+1)%beamPalettes.length;
    pointer.holdStart=performance.now();
    pointer.holdMs=0;
    setPointerFromEvent(e);
    startHoldSound();
  }, {passive:true});
  addEventListener('pointerup', ()=>{
    if(pointer.down && pointer.holdMs>60){
      shockwaves.push({x:pointer.px,y:pointer.py,born:performance.now(),power:clamp(pointer.holdMs/1050,.18,1),mode:pointer.mode});
      if(shockwaves.length>5) shockwaves.shift();
    }
    pointer.down=false;
    pointer.holdMs=0;
    stopHoldSound(true);
  }, {passive:true});
  addEventListener('pointercancel', ()=>{ pointer.down=false; pointer.holdMs=0; stopHoldSound(false); }, {passive:true});
  addEventListener('blur', ()=>{ pointer.down=false; pointer.holdMs=0; stopHoldSound(false); });
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopHoldSound(false); });
  addEventListener('touchmove', (e)=>{ setPointerFromEvent(e); }, {passive:true});

  // ==========================
  // Indra Web (hex lattice)
  // ==========================
  let nodes = [];
  let edges = [];
  let hexSize = 36;
  let cols=0, rows=0;

  function buildWeb(){
    nodes.length = 0;
    edges.length = 0;

    const short = Math.min(w,h);
    const long  = Math.max(w,h);
    const aspect = long/short;

    // Dense on wide screens so it fills nicely
    const base = short / (isMobile() ? 15.0 : 12.0);
    const portraitFactor = isPortrait() ? 0.90 : 1.0;
    const aspectFactor = clamp(1.0 - (aspect-1.0)*0.18, 0.72, 1.0);
    const mobileFactor = isMobile() ? 0.85 : 1.02;

    hexSize = clamp(base * portraitFactor * aspectFactor * mobileFactor, 16*dpr, 58*dpr);

    const dx = hexSize;
    const dy = hexSize * Math.sqrt(3)/2;

    const padCols = isMobile()? 7 : (aspect>1.6 ? 12 : 9);
    const padRows = isMobile()? 7 : (aspect>1.6 ? 10 : 9);

    cols = Math.ceil(w/dx) + padCols;
    rows = Math.ceil(h/dy) + padRows;

    // depth for subtle 3D (cheap, static)
    const zAmp = isMobile() ? 0.55 : 0.85;

    for(let j=0;j<rows;j++){
      for(let i=0;i<cols;i++){
        const offset = (j%2)*0.5;
        const x0 = (i + offset) * dx - dx*(padCols*0.55);
        const y0 = j * dy - dy*(padRows*0.55);

        // radial depth (center closer)
        const nx = (x0 - w*0.5) / (Math.max(w,h));
        const ny = (y0 - h*0.52) / (Math.max(w,h));
        const r = Math.sqrt(nx*nx + ny*ny);
        let z0 = (0.60 - r*1.15) * zAmp;
        z0 = clamp(z0, -1, 1);

        // energy = "honey/light" stored in nodes
        nodes.push({
          x0,y0,z0,
          x:x0, y:y0, z:z0,
          // instantaneous deformation offset (no heavy physics)
          ox:0, oy:0,
          e:0,     // energy 0..1
          seed: ((Math.sin(i*127.1 + j*311.7)*43758.5453)%1+1)%1
        });
      }
    }

    const index = (i,j)=> j*cols + i;
    function addEdge(a,b){
      if(a<0||b<0||a>=nodes.length||b>=nodes.length) return;
      edges.push([a,b]);
    }

    const wide = (aspect>1.6) && !isMobile();
    const modA = wide ? 15 : 23;
    const modB = wide ? 19 : 29;

    for(let j=0;j<rows;j++){
      for(let i=0;i<cols;i++){
        const a = index(i,j);
        addEdge(a, index(i+1,j));
        addEdge(a, index(i + (j%2), j+1));
        addEdge(a, index(i - (j%2==0?1:0), j+1));

        // rare far links (Indra reflections)
        if(((i*13 + j*7) % modA) === 0) addEdge(a, index(i+2, j+1));
        if(((i*19 + j*11) % modB) === 0) addEdge(a, index(i-2, j+1));
        if(wide && ((i*5 + j*9) % 31) === 0) addEdge(a, index(i+3, j));
      }
    }
  }

  // Projection (cheap 3D)
  const cam = { z: -2.75, fov: 2.28, scale: 0.60 };

  function project(n){
    // depth with energy bulge
    const z = n.z + n.e*0.28;
    const zz = (z - cam.z);
    const s = cam.fov / zz;

    // parallax: deeper points move less, closer points move more (adds real 3D feel)
    const px = pointer.seen ? (pointer.px - w*0.5) : 0;
    const py = pointer.seen ? (pointer.py - h*0.52) : 0;
    const par = (0.06 + (z+1)*0.10); // near -> more parallax
    const xPar = px * par;
    const yPar = py * par;

    const x2 = n.x + n.ox + xPar;
    const y2 = n.y + n.oy + yPar;

    return {
      x: w*0.5 + (x2 - w*0.5) * s * cam.scale,
      y: h*0.52 + (y2 - h*0.52) * s * cam.scale,
      s,
      z
    };
  }
  
// ==========================
// UFO beam geometry (single source of truth)
// ==========================
function ufoParams(){
  const s = (isMobile() ? 11 : 12) * dpr; // must mirror drawUFO()
  const r = s*1.65;
  // Beam length is shared by: (1) visual beam, (2) ground spot, (3) interaction target.
  const beamH = (isMobile()? 230 : 320) * dpr;
  const beamW = r*1.25;
  const beamStartY = r*0.65; // from craft center to beam start
  return {s,r,beamH,beamW,beamStartY};
}

function beamTarget(){
  return { x: w*0.5, y: h*0.52 };
}
// ==========================
  // Behavior: instant local reaction + quiet elsewhere + idle random micro-pulses
  // ==========================
  function updateEnergy(t, dt){
    // pointer velocity (for "spider movement" feedback)
    pointer.vx = pointer.px - lastPointer.px;
    pointer.vy = pointer.py - lastPointer.py;
    lastPointer.px = pointer.px;
    lastPointer.py = pointer.py;

    const speed = Math.sqrt(pointer.vx*pointer.vx + pointer.vy*pointer.vy) / (30*dpr);
    const speedK = clamp(speed, 0, 1);

    const tx = w*0.5;
    const ty = h*0.52;

    let mx = pointer.down ? tx : (pointer.seen ? pointer.px : tx);
    let my = pointer.down ? ty : (pointer.seen ? pointer.py : ty);

    // local influence radius: only nearby reacts
    const R = (isMobile() ? 120 : 180) * dpr * (pointer.down ? 1.25 : 1.00);
    const R2 = R*R;

    // deposit strength: mainly on press (spotlight)
    const hoverDeposit = 0.04; // tiny hover (keeps life)
    const pressDeposit = (0.55 + speedK*0.30); // strong on press
    const deposit = pointer.down ? pressDeposit : hoverDeposit;

    // decay: quiet elsewhere quickly
    const decay = pointer.down ? 0.90 : 0.82; // per-frame-ish multiplier, adjusted by dt below
    const decayAdj = Math.pow(decay, dt*60);  // frame-rate independent

    // idle detection
    const idle = (!pointer.down) && (performance.now() - lastMoveAt > 650) && (speedK < 0.02);

    // random micro pulses when idle (very subtle)
    if(idle && Math.random() < 0.06){
      const k = (Math.random()*nodes.length)|0;
      nodes[k].e = Math.min(1, nodes[k].e + 0.35);
    }

    for(const n of nodes){
      // decay energy everywhere
      n.e *= decayAdj;

      // relax deformation quickly (so quiet areas stay still)
      n.ox *= 0.78;
      n.oy *= 0.78;

      // base position is static (cheap)
      n.x = n.x0;
      n.y = n.y0;
      n.z = n.z0;

      // pointer contact
      const dx = n.x0 - mx;
      const dy = n.y0 - my;
      const d2 = dx*dx + dy*dy;

      if(d2 < R2){
        const d = Math.sqrt(d2) + 1e-6;
        const q = (1 - d/R);

        // immediate "honey fill" (energy up)
        n.e = Math.min(1, n.e + q * deposit);

        // deformation: swirl around pointer like web tension (instant)
        const perpX = -dy / d;
        const perpY =  dx / d;

        const pull = -q * (8 + 10*speedK) * dpr;
        const swirl = q * (10 + 14*(pointer.down?1:0.3)) * dpr;

  // Keyboard (Enter/Space)
  addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      goWarp();
    }
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
